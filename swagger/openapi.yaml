openapi: 3.0.3
info:
  title: TeamFlow API
  description: |
    TeamFlow — Mini Jira benzeri takım proje yönetim aracı REST API dokümantasyonu.

    ## Kimlik Doğrulama

    Korunan endpoint'lere erişmek için `Authorization` header'ında Bearer token gönderin:
    ```
    Authorization: Bearer <access_token>
    ```

    Access token 15 dakikada sona erer. Yenilemek için `/api/auth/refresh` endpoint'ini kullanın.
  version: 1.0.0
  contact:
    name: CENG316 — TeamFlow Ekibi

servers:
  - url: http://localhost:3000
    description: Geliştirme sunucusu

tags:
  - name: Auth
    description: Kimlik doğrulama işlemleri
  - name: Notifications
    description: Bildirim yönetimi
  - name: Projects
    description: Proje CRUD ve üye yönetimi (Kişi B)
  - name: Tasks
    description: Görev CRUD, atama ve durum yönetimi (Kişi B)
  - name: Labels
    description: Etiket yönetimi (Kişi B)
  - name: Sprints
    description: Sprint yönetimi (Kişi C)
  - name: Comments
    description: Yorum sistemi (Kişi C)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          format: email
          example: "john@example.com"
        full_name:
          type: string
          example: "John Doe"
        avatar_url:
          type: string
          nullable: true
          example: "https://example.com/avatar.png"
        created_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "TeamFlow MVP"
        description:
          type: string
          nullable: true
        owner_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, archived, completed]
          example: active
        created_at:
          type: string
          format: date-time

    ProjectMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, contributor, viewer]
        joined_at:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        sprint_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: "Login sayfası yap"
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, in_progress, done]
          example: todo
        priority:
          type: string
          enum: [low, medium, high, critical]
          example: medium
        due_date:
          type: string
          format: date
          nullable: true
        created_by:
          type: string
          format: uuid
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/User"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        created_at:
          type: string
          format: date-time

    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          example: "bug"
        color:
          type: string
          example: "#EF4444"
        created_at:
          type: string
          format: date-time

    Sprint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Sprint 1"
        goal:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [planning, active, completed]
          example: planning
        created_at:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        username:
          type: string
        full_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
          example: "Göreviniz güncellendi"
        is_read:
          type: boolean
          example: false
        link:
          type: string
          nullable: true
          example: "/projects/abc/tasks/xyz"
        created_at:
          type: string
          format: date-time

    ProjectStatistics:
      type: object
      properties:
        total_tasks:
          type: integer
          example: 24
        completed_tasks:
          type: integer
          example: 10
        in_progress_tasks:
          type: integer
          example: 6
        todo_tasks:
          type: integer
          example: 8

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Bir hata oluştu"
        errors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

paths:
  # ─────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Kullanıcı kaydı
      description: Yeni bir kullanıcı hesabı oluşturur ve token çifti döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: "^[a-zA-Z0-9_]+$"
                  example: "johndoe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  minLength: 6
                  example: "gizli123"
                full_name:
                  type: string
                  maxLength: 100
                  example: "John Doe"
      responses:
        "201":
          description: Kayıt başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        "400":
          description: Validasyon hatası
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: E-posta veya kullanıcı adı zaten kullanılıyor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Kullanıcı girişi
      description: E-posta ve şifre ile giriş yapar, Access Token + Refresh Token döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  example: "gizli123"
      responses:
        "200":
          description: Giriş başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          accessToken:
                            type: string
                            description: 15 dakika geçerli JWT
                          refreshToken:
                            type: string
                            description: 7 gün geçerli refresh token
        "400":
          description: Validasyon hatası
        "401":
          description: E-posta veya şifre hatalı

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Token yenileme
      description: Geçerli bir refresh token ile yeni bir access token alır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGci..."
      responses:
        "200":
          description: Yeni access token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
        "401":
          description: Geçersiz veya süresi dolmuş refresh token

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Çıkış yap
      description: Refresh token'ı iptal eder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Çıkış başarılı
        "400":
          description: Refresh token bulunamadı

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Mevcut kullanıcı bilgileri
      description: Token'daki kullanıcının profil bilgilerini döner.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kullanıcı bilgileri
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          description: Token geçersiz veya eksik
        "404":
          description: Kullanıcı bulunamadı

  /api/auth/profile:
    put:
      tags: [Auth]
      summary: Profil güncelleme
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  maxLength: 100
                  example: "John Updated Doe"
                avatar_url:
                  type: string
                  format: uri
                  example: "https://example.com/new-avatar.png"
      responses:
        "200":
          description: Profil güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          description: Validasyon hatası
        "401":
          description: Yetkisiz

  /api/auth/password:
    put:
      tags: [Auth]
      summary: Şifre değiştirme
      description: Mevcut şifreyi doğrulayarak yeni şifre belirler. Tüm refresh token'lar iptal edilir.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  example: "eskiSifre123"
                new_password:
                  type: string
                  minLength: 6
                  example: "yeniSifre456"
      responses:
        "200":
          description: Şifre başarıyla değiştirildi
        "400":
          description: Validasyon hatası
        "401":
          description: Mevcut şifre hatalı

  # ─────────────────────────────────────────────
  # NOTIFICATIONS
  # ─────────────────────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Bildirimleri listele
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: unread
          schema:
            type: boolean
          description: Sadece okunmamış bildirimleri getir
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Maksimum bildirim sayısı
      responses:
        "200":
          description: Bildirim listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          notifications:
                            type: array
                            items:
                              $ref: "#/components/schemas/Notification"
                          unreadCount:
                            type: integer
                            example: 3
        "401":
          description: Yetkisiz

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Tüm bildirimleri okundu işaretle
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tüm bildirimler okundu olarak işaretlendi
        "401":
          description: Yetkisiz

  /api/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Bildirimi okundu işaretle
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bildirim okundu olarak işaretlendi
        "401":
          description: Yetkisiz
        "404":
          description: Bildirim bulunamadı

  /api/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Bildirimi sil
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bildirim silindi
        "401":
          description: Yetkisiz

  # ─────────────────────────────────────────────
  # PROJECTS  (Kişi B tarafından doldurulacak)
  # ─────────────────────────────────────────────
  /api/projects:
    post:
      tags: [Projects]
      summary: Yeni proje oluştur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 150
                  example: "TeamFlow MVP"
                description:
                  type: string
                  maxLength: 1000
                  example: "Mini Jira benzeri proje yönetim aracı"
      responses:
        "201":
          description: Proje oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "400":
          description: Validasyon hatası
        "401":
          description: Yetkisiz
    get:
      tags: [Projects]
      summary: Kullanıcının projelerini listele
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Proje listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
        "401":
          description: Yetkisiz

  /api/projects/{id}:
    get:
      tags: [Projects]
      summary: Proje detayı
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Proje detayı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Project"
        "403":
          description: Erişim yetkisi yok
        "404":
          description: Proje bulunamadı
    put:
      tags: [Projects]
      summary: Proje güncelle (sadece owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 150
                description:
                  type: string
                  maxLength: 1000
                status:
                  type: string
                  enum: [active, archived, completed]
      responses:
        "200":
          description: Proje güncellendi
        "403":
          description: Sadece owner güncelleyebilir
        "404":
          description: Proje bulunamadı
    delete:
      tags: [Projects]
      summary: Proje sil (sadece owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Proje silindi
        "403":
          description: Sadece owner silebilir
        "404":
          description: Proje bulunamadı

  /api/projects/{id}/members:
    get:
      tags: [Projects]
      summary: Proje üyelerini listele
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Üye listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProjectMember"
        "403":
          description: Erişim yetkisi yok
    post:
      tags: [Projects]
      summary: Projeye üye ekle (owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [owner, contributor, viewer]
                  default: viewer
      responses:
        "201":
          description: Üye eklendi
        "403":
          description: Sadece owner üye ekleyebilir
        "404":
          description: Kullanıcı bulunamadı

  /api/projects/{id}/members/{userId}:
    delete:
      tags: [Projects]
      summary: Üyeyi projeden çıkar (owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Üye çıkarıldı
        "403":
          description: Sadece owner üye çıkarabilir

  /api/projects/{id}/statistics:
    get:
      tags: [Projects]
      summary: Proje istatistikleri
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: İstatistikler
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProjectStatistics"

  /api/projects/{id}/activities:
    get:
      tags: [Projects]
      summary: Proje aktivite akışı
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Aktivite listesi
        "403":
          description: Erişim yetkisi yok

  # ─────────────────────────────────────────────
  # TASKS  (Kişi B tarafından doldurulacak)
  # ─────────────────────────────────────────────
  /api/projects/{id}/tasks:
    post:
      tags: [Tasks]
      summary: Görev oluştur
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Proje ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
                  example: "Login sayfası tasarımı"
                description:
                  type: string
                  maxLength: 2000
                status:
                  type: string
                  enum: [todo, in_progress, done]
                  default: todo
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
                due_date:
                  type: string
                  format: date
                  example: "2026-05-21"
                sprint_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "201":
          description: Görev oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "400":
          description: Validasyon hatası
        "403":
          description: Yetki yok (viewer görev oluşturamaz)
    get:
      tags: [Tasks]
      summary: Proje görevlerini listele
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [todo, in_progress, done]
        - in: query
          name: sprint_id
          schema:
            type: string
            format: uuid
        - in: query
          name: assignee_id
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Görev listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Task"

  /api/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Görev detayı (atananlar + etiketler dahil)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Görev detayı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
