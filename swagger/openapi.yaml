  # ─────────────────────────────────────────────
  # COMMENTS  (Kişi C tarafından doldurulacak)
  # ─────────────────────────────────────────────
  /api/tasks/{id}/comments:
    post:
      tags: [Comments]
      summary: Yorum ekle
      description: |
        `parent_id` verilirse reply (iç içe yorum), verilmezse root comment olur.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Görev ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 2000
                  example: "Bu görev öncelikli olarak ele alınmalı."
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Reply için üst yorum ID
      responses:
        "201":
          description: Yorum eklendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Comment"
        "400":
          description: Validasyon hatası
        "403":
          description: Yetki yok (viewer yorum yapabilir, sadece viewer'a izin verilecekse güncelle)
    get:
      tags: [Comments]
      summary: Görev yorumlarını listele (iç içe ağaç yapısı)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Yorumlar (replies iç içe)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Comment"

  /api/comments/{id}:
    put:
      tags: [Comments]
      summary: Yorum güncelle (sadece yazar)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Yorum güncellendi
        "403":
          description: Sadece yorum sahibi güncelleyebilir
        "404":
          description: Yorum bulunamadı
    delete:
      tags: [Comments]
      summary: Yorum sil (yazar veya proje owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Yorum silindi
        "403":
          description: Yetki yok
        "404":
          description: Yorum bulunamadı

