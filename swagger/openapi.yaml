  # ─────────────────────────────────────────────
  # SPRINTS  (Kişi C tarafından doldurulacak)
  # ─────────────────────────────────────────────
  /api/projects/{id}/sprints:
    post:
      tags: [Sprints]
      summary: Sprint oluştur
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: "Sprint 1"
                goal:
                  type: string
                  maxLength: 500
                  example: "Auth ve temel görev yönetimini bitir"
                start_date:
                  type: string
                  format: date
                  example: "2026-05-07"
                end_date:
                  type: string
                  format: date
                  example: "2026-05-21"
      responses:
        "201":
          description: Sprint oluşturuldu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Sprint"
        "400":
          description: Validasyon hatası
        "403":
          description: Yetki yok
    get:
      tags: [Sprints]
      summary: Sprint listesi
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sprint listesi
