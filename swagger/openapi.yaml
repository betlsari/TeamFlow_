openapi: 3.0.3
info:
  title: TeamFlow API
  description: |
    TeamFlow — Mini Jira benzeri takım proje yönetim aracı REST API dokümantasyonu.

    ## Kimlik Doğrulama

    Korunan endpoint'lere erişmek için `Authorization` header'ında Bearer token gönderin:
    ```
    Authorization: Bearer <access_token>
    ```

    Access token 15 dakikada sona erer. Yenilemek için `/api/auth/refresh` endpoint'ini kullanın.
  version: 1.0.0
  contact:
    name: CENG316 — TeamFlow Ekibi

servers:
  - url: http://localhost:3000
    description: Geliştirme sunucusu

tags:
  - name: Auth
    description: Kimlik doğrulama işlemleri
  - name: Notifications
    description: Bildirim yönetimi

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          format: email
          example: "john@example.com"
        full_name:
          type: string
          example: "John Doe"
        avatar_url:
          type: string
          nullable: true
          example: "https://example.com/avatar.png"
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
          example: "Göreviniz güncellendi"
        is_read:
          type: boolean
          example: false
        link:
          type: string
          nullable: true
          example: "/projects/abc/tasks/xyz"
        created_at:
          type: string
          format: date-time

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Bir hata oluştu"
        errors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

paths:
  # ─────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Kullanıcı kaydı
      description: Yeni bir kullanıcı hesabı oluşturur ve token çifti döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: "^[a-zA-Z0-9_]+$"
                  example: "johndoe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  minLength: 6
                  example: "gizli123"
                full_name:
                  type: string
                  maxLength: 100
                  example: "John Doe"
      responses:
        "201":
          description: Kayıt başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        "400":
          description: Validasyon hatası
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: E-posta veya kullanıcı adı zaten kullanılıyor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Kullanıcı girişi
      description: E-posta ve şifre ile giriş yapar, Access Token + Refresh Token döner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  example: "gizli123"
      responses:
        "200":
          description: Giriş başarılı
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          accessToken:
                            type: string
                            description: 15 dakika geçerli JWT
                          refreshToken:
                            type: string
                            description: 7 gün geçerli refresh token
        "400":
          description: Validasyon hatası
        "401":
          description: E-posta veya şifre hatalı

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Token yenileme
      description: Geçerli bir refresh token ile yeni bir access token alır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGci..."
      responses:
        "200":
          description: Yeni access token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
        "401":
          description: Geçersiz veya süresi dolmuş refresh token

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Çıkış yap
      description: Refresh token'ı iptal eder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Çıkış başarılı
        "400":
          description: Refresh token bulunamadı

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Mevcut kullanıcı bilgileri
      description: Token'daki kullanıcının profil bilgilerini döner.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kullanıcı bilgileri
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          description: Token geçersiz veya eksik
        "404":
          description: Kullanıcı bulunamadı

  /api/auth/profile:
    put:
      tags: [Auth]
      summary: Profil güncelleme
      description: Kullanıcının ad-soyad veya avatar URL'ini günceller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  maxLength: 100
                  example: "John Updated Doe"
                avatar_url:
                  type: string
                  format: uri
                  example: "https://example.com/new-avatar.png"
      responses:
        "200":
          description: Profil güncellendi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          description: Validasyon hatası
        "401":
          description: Yetkisiz

  /api/auth/password:
    put:
      tags: [Auth]
      summary: Şifre değiştirme
      description: Mevcut şifreyi doğrulayarak yeni şifre belirler. Tüm refresh token'lar iptal edilir.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  example: "eskiSifre123"
                new_password:
                  type: string
                  minLength: 6
                  example: "yeniSifre456"
      responses:
        "200":
          description: Şifre başarıyla değiştirildi
        "400":
          description: Validasyon hatası
        "401":
          description: Mevcut şifre hatalı

  # ─────────────────────────────────────────────
  # NOTIFICATIONS
  # ─────────────────────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Bildirimleri listele
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: unread
          schema:
            type: boolean
          description: Sadece okunmamış bildirimleri getir
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
          description: Maksimum bildirim sayısı
      responses:
        "200":
          description: Bildirim listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          notifications:
                            type: array
                            items:
                              $ref: "#/components/schemas/Notification"
                          unreadCount:
                            type: integer
                            example: 3
        "401":
          description: Yetkisiz

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Tüm bildirimleri okundu işaretle
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tüm bildirimler okundu olarak işaretlendi
        "401":
          description: Yetkisiz

  /api/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Bildirimi okundu işaretle
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bildirim okundu olarak işaretlendi
        "401":
          description: Yetkisiz
        "404":
          description: Bildirim bulunamadı

  /api/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Bildirimi sil
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bildirim silindi
        "401":
          description: Yetkisiz

  /health:
    get:
      tags: [Auth]
      summary: Sunucu sağlık kontrolü
      responses:
        "200":
          description: Sunucu çalışıyor
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Sunucu çalışıyor"
