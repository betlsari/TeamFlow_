  # ─────────────────────────────────────────────
  # LABELS  (Kişi B tarafından doldurulacak)
  # ─────────────────────────────────────────────
  /api/projects/{id}/labels:
    get:
      tags: [Labels]
      summary: Proje etiketlerini listele
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Etiket listesi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Label"
    post:
      tags: [Labels]
      summary: Yeni etiket oluştur
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 50
                  example: "bug"
                color:
                  type: string
                  pattern: "^#[0-9A-Fa-f]{6}$"
                  example: "#EF4444"
      responses:
        "201":
          description: Etiket oluşturuldu
        "400":
          description: Validasyon hatası veya etiket adı zaten mevcut

  /api/labels/{id}:
    delete:
      tags: [Labels]
      summary: Etiketi sil
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Etiket silindi
        "403":
          description: Yetki yok

  /api/tasks/{id}/labels:
    post:
      tags: [Labels]
